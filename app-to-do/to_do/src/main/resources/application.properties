spring.application.name=to_do

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:46451/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=validate: Hibernate solo VALIDA que las tablas/columnas de la BD coincidan con las
# entidades JPA (Task). No crea ni modifica nada; si hay discrepancia, la app falla al arrancar.
# Opciones: create (borra y recrea todo), update (agrega columnas faltantes), none (no hace nada).
# En producción lo seguro es validate o none. Va junto a Flyway: Flyway crea/actualiza el esquema
# con scripts SQL versionados y Hibernate solo verifica que coincida con las entidades.
# Si editas la entidad Task sin agregar migración, el arranque falla.
spring.jpa.hibernate.ddl-auto=validate

# open-in-view=false: desactiva el Open Session in View (OSIV), comportamiento por defecto de Spring Boot.
# Con true (default), Hibernate mantiene la sesión abierta durante TODA la petición HTTP, incluso
# después de que el service termina. Sirve para relaciones lazy en la respuesta JSON, pero cierra la
# sesión tarde (conexiones BD ocupadas más tiempo, riesgo de agotar el pool) y enmascara errores de
# LazyInitializationException en desarrollo.
# Con false, la sesión se cierra al terminar la transacción/service. Si accedes a un objeto lazy
# fuera de ella -> LazyInitializationException. Es la práctica recomendada: resolver los datos en el
# service (fetch o JOIN FETCH) y devolver DTOs, como ya se hace con TaskResponse.
spring.jpa.open-in-view=false

spring.flyway.enabled=true

